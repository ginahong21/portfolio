"產品規劃＆設計"},{label:"期間",value:"2025.09 – 現在"},{label:"平台",value:"iOS & Android App"},{label:"團隊 (10+)",value:"產品經理：我\nPM、TPM、UI 各 1\nApp 開發 6・中台開發 2"}],metrics:[{value:"2 倍",label:"會員數成長"},{value:"3,200 人",label:"月活躍用戶"},{value:"約 5%",label:"付費轉換率"}],myRole:["主導 C 端 App 的產品規劃與使用者體驗設計，範圍從錄音、即時辨識與翻譯，到額度卡控與方案購買","用 Claude 建立產品 prototype，把正向與例外流程展開在 Figma 畫布上對焦需求、收集回饋，定版後以 Claude Code 產出 PRD.md","以 AI Skill 重新整理既有 Figma 設計稿的元件與 Design Token，建立成 Storybook 元件庫","把關 AI 產出品質（辨識率、摘要正確性）與上線前驗收"],cover:{kind:"phone",palette:3,seed:11},coverImg:"img/aiapp/cover.webp",heroImg:"img/aiapp/hero.webp",sections:[{heading:"背景",body:"B2B Web 的使用集中在會議室，手機端卻散在各種現場。收斂出三大客群，依各自的需求規劃功能。",groups:[{title:"上班族／業務",points:["痛點：邊開會邊打字，顧著記錄就跟不上討論，會後還要重聽補齊。","需求：專注參與討論，會後直接拿到完整記錄與待辦。"]},{title:"進修者／參與講座",points:["痛點：講者講得快、投影片換得更快，手寫跟不上；外語場次光聽懂就吃力。","需求：留住講者觀點與引言，外語場次需要翻譯對照。"]},{title:"採訪者／紀錄員",points:["痛點：多人輪流發言，要找某句原話得反覆回聽、對時間軸。","需求：以講者區分逐字稿，快速查找各受訪者說過的話。"]}]},{heading:"我怎麼做",pointsPlain:!0,points:["1. 提出首頁 A、B 兩案做 A/B testing","A 案：以範本為入口，先選範本再錄音，產出的整理度高，但和多數人熟悉的錄音習慣不同，初次使用容易卡住。","B 案：把錄音與上傳直接放在首頁，開啟 App 就能開錄。","結果：B 案完成首次檔案生成的比例高出 34%，首次點擊錄音或上傳也多在 5 秒內完成，因此選定 B 案展開，範本改以「推薦範本」留在首頁下方，不擋在錄音前面。","[[ai-ab]]","2. AI 摘要生成流程自動化：評估辨識與 AI 成本和使用體驗後，把摘要從手動觸發改為錄音結束自動產出。等待時間會隨檔案長度拉長，因此生成過程顯示進度，完成後推播通知，點擊直接查看。","[[ai-steps]]","3. 免費試用與重新上傳：服務初期以免費試用為主，每月提供 60～360 分鐘的體驗額度，從使用過程觀察哪些接觸點最接近付費決策。當額度不足、檔案超過傳輸限制或系統異常時，可在檔案列表直接點一次上傳，從中斷的地方接著做完，不用重錄，也不會以為檔案不見了。","4. 讓紀錄更好找、更好用、辨識更準：","a. 錄製中可進行段落標記，可於逐字稿快速反閱及重聽重要內容。","b. 紀錄提到時間、地點等關鍵資訊時，可透過 AI 建立行事曆。","c. 即時字幕語音導入 myVoca 新型辨識模型，即時辨識回應 < 1 秒、AI 算力成本節省 88%，金融、醫療、政府等專業情境辨識率達 97%。","5. 即時翻譯：大多數人的使用方式是切到 Google 翻譯，邊聽邊打字、來回複製貼上，對話常被打斷也只能單向翻。改成在錄音畫面邊聽邊翻，並提供「雙語對照」與「純譯文」兩種模式——前者輔助理解，後者給完全不懂對方語言的人，字級也可自由調整，小螢幕一樣好讀。外語講座、跨國會議與外籍員工溝通，都能讓語言傳遞簡單、清楚的掌握。"],pointImages:{7:[{src:"img/aiapp/pay.webp",caption:"額度不足、上傳失敗或系統異常都能在檔案列表直接重新上傳；完成後以方案 Hook 導向訂閱。"}],11:[{src:"img/aiapp/feat.webp",caption:"錄製中標記段落可在逐字稿快速定位；摘要裡的時間與地點可一鍵加入手機行事曆。"}],12:[{src:"img/aiapp/trans.webp",caption:"錄製前先選辨識模型與翻譯語言，字幕可切換雙語對照或純譯文，字級也能調整；翻譯額度用完後以「立即解鎖」作為付費 Hook。"}]}},{heading:"我如何使用 AI 與團隊合作",body:"產品規劃與設計流程沒有改變，改變的是把 AI 與既有工具串起來：Claude Code × Mobbin × Figma × Firebase。一開始想完全跳過 Figma，直接用 Claude Code 做設計、讓團隊點擊測試，但可點擊的原型只走得完 Happy Path，例外情境難以一起看、也不容易在多人之間取得共識；因此改以 Figma 當作討論的場所。",diagram:"ai-workflow",bodyEnd:"過程中套用設計系統的正確性只有六到七成，追下去發現問題出在 Figma 設計稿的命名與圖層散亂。於是我以 AI Skill 重新整理可重複使用的 Component，把 Design Token 導入 Material Design 3 規範，進一步建立 Storybook 元件庫：之後用元件組裝頁面就能驗證產品功能，不必每次從零做 UI，和工程師之間的設計交付也更順。目前的卡點是：已經在迭代中的產品，要如何把這套元件庫銜接回既有的程式碼。",endFigures:[{src:"img/aiapp/ds-storybook.webp",caption:"Storybook 元件庫：Design Token 與 158 個圖示、元件可直接取用。"},{src:"img/aiapp/ds-repo.webp",caption:"產品文件與設計稿同步放在 GitHub repo，分支與 PR 管控版本。"}]},{heading:"成果",points:["App 上線：2025.09 推出，以免費體驗拓展用戶，至今年底用戶數較去年成長 2 倍。","收費機制：依額度使用量與時數用盡的天數規劃額度卡控與轉付費提示，2026.11 於 App Store、Google Play 與台灣大哥大通路上線。","即時翻譯：依競品與用戶需求規劃，2026.12 推出；上線後觀測下午尖峰時段的線數是否吃滿，避免用戶排隊等候。","範本收斂：自動摘要上線後，預設範本已能滿足多數需求，使用率前三名的會議記錄、學霸筆記、白話文合計約 5 成，因此從 30＋ 個收斂到 20 個以內，降低維護成本。"]}]},{slug:"ai-dictation-saas",title:"AI聽寫大哥 B2B SaaS 平台",tag:"產品改版",summary:"AI聽寫大哥是支援中、英、台、客語混用辨識的 AI 語音紀錄平台，能快速產出逐字稿、摘要與產業 AI 範本。原平台由合作廠商開發、操作偏技術導向，業務與客服都得靠詳細教學才能推廣。這次改版重新設計使用體驗，產品說明文件從 34 頁縮減至 8 頁。",myRole:["盤點協作廠商既有平台的功能與操作流程","親自操作體驗，並蒐集業務、客服及試用同仁的回饋，歸納優化項目清單","撰寫改版 PRD，定義新的資訊架構與版面佈局，並產出 Figma UI flows 及 mockup","負責管理設計專案流程，協調功能調整與新 API 開發","向 stakeholder 說明改版目標及內容，並把關 UAT 測試"],meta:[{label:"角色",value:"產品經理"},{label:"期間",value:"2025.05 – 2025.11\n(完整上線)"},{label:"平台",value:"B2B SaaS Web"},{label:"團隊",value:"改版項目負責人：我\nUI 設計師：Ling\nTPM：Kenneth\nBPM：Jojo"}],metrics:[{value:"34 → 8 頁",label:"產品說明文件縮減"},{value:"2,500 家",label:"累積企業試用"},{value:"+26%",label:"錄音到生成檔案的完成率"}],cover:{kind:"chart",palette:0,seed:21},coverImg:"img/saas/cover.webp",heroImg:"img/saas/cover.webp",heroRatio:"4 / 3",sections:[{heading:"專案背景",body:"AI聽寫大哥是合作技術廠商已開發完成的平台。專案初期我發現，它面臨的挑戰不僅是視覺設計，而是更根本的問題：",points:["資源有限：手上只有平台的使用權限，沒有規格文件與完整程式碼，初期盤點耗費大量時間。","品牌不一致：既有平台的風格與台灣大哥大的品牌形象、Logo 設計完全不符。","結構與流程不直覺：資訊架構與工作流程以技術為導向，使用者難以理解如何操作。","文案造成誤解：用語不通順、不易理解，導致使用者產生認知錯誤。"]},{heading:"發現",body:"在專案前期，統整我自己實際操作網站、蒐集內部同仁的回饋，依「錄音前、錄音中、完成錄製」三個階段，把使用者卡關的地方歸納為三類痛點：",groups:[{title:"錄音前｜找不到起點",points:["要同時錄下線上與實體聲音，得先下載桌機程式、設定伺服器連線；少了這一步，錄音內容就會不完整","「錄音」、「上傳音檔」藏在「逐字稿生成」的下拉選單裡，名稱和「開始錄音」對不上，光是找到第一步就很費力","進到功能頁後，畫面資訊太多，看不出該先做什麼、再做什麼"]},{title:"錄音中｜操作讓人不安",points:["「暫停」與「結束」按鈕並排、圖示相近，使用者擔心一按錯，錄音就沒了","上傳檔案前要先選辨識模型，但使用者看不出各模型有什麼不同"]},{title:"完成錄製｜找不到結果與價值",points:["逐字稿依錄音方式分散在「任務管理 → 離線辨識／即時辨識」兩處，而「離線」、「即時」的用詞和一般人對錄音的理解有落差","摘要功能藏在逐字稿編輯的深處，很多人根本不知道有這麼好用的功能"]}]},{heading:"我的做法",body:"我重新規劃了功能流程，讓使用者不必再猜測產品怎麼用：進到畫面就知道從哪裡開始，每一步都清楚下一步在哪，完成後感受到 WOW 的價值。",tabs:[{label:"使用前",points:["建立信任感：a. 導入台灣大哥大與 AI聽寫大哥的品牌識別與色彩，取代原廠商的通用介面，讓企業客戶一眼認出這是台灣大哥大的服務[[saas-brand-b]]b. 開啟網頁即自動偵測桌機工具，未安裝時以彈窗說明下載用途、安裝時間與安全性，降低安裝疑慮、提升安裝率，確保錄音內容不遺漏[[saas-detect]]","平台架構重新設計：版面由單欄式改為三欄式，主要動作更突出、導覽隨時可見，並擴大 Body 的顯示範圍，讓閱讀、編輯逐字稿與播放音檔這類長時間操作更順手[[saas-layout]]","導覽從 Header 移至側欄：a. 側欄依帳號權限顯示功能，非主要功能收至底部；側欄收合，滑過圖示即顯示功能名稱[[saas-nav-states]]b. 核心功能提升至第一層並依使用頻率排序；「即時錄音」改名為「語音轉文字」，直接說出產出結果，避免用戶誤以為沒有逐字稿[[saas-nav]]"]},{label:"錄製中",points:["[[saas-recflow]][[saas-proto]]"]},{label:"完成錄製",points:["結果集中一處：錄音檔統一收攏至「我的檔案」，不必再記得當初用哪種方式錄、存在哪裡","列表即可操作：在檔案列表就能直接編輯檔名、查看逐字稿、進入摘要快速生成，以及下載所需格式的檔案，常用動作不必再層層點進去[[saas-files]]"]}]},{heading:"成果",body:"經過內部驗證，重新設計的網頁平台於 2025/11 完整上線。雖然新的操作方式需要使用者短暫適應，但 GA4 數據顯示成效明顯提升：",points:["錄音到檔案的完成率 +26%：從「開始錄音」到「生成檔案」的事件轉換率增加 26%。","摘要使用率翻倍：摘要功能使用率從 28% 提升至 56%。","核心功能高度使用：錄音、即時字幕功能，每月平均使用率超過 7 成。"],bodyAfter:"使用者停留時間更長，也更常完成從錄音、逐字稿到摘要的完整流程，驗證了這次體驗方向與優先順序的判斷。下一步，是把 B2B 網頁版的高價值功能帶給 B2C 的 App 個人用戶，並以簡潔易懂的引導提示，優化功能之間的切換體驗。"}]},{slug:"anti-fraud",title:"反詐戰警 APP",tag:"產品設計",summary:"詐騙已滲透到一般人的日常。台灣大哥大以電信數據結合 AI，推出反詐戰警個人版，這是一款全方位防詐 (號碼、簡訊、URL、應用程式、圖文資訊) 的應用程式，從最常見的管道開始，攔阻不懷好意的詐騙樣貌。",myRole:["主導 0 到 1 的產品流程、產品文案及互動設計","擔任設計團隊窗口，帶領 2 位設計師分配任務並把關交付品質","進行競品分析，定義後進產品的設計主軸","在 3 個月完成 Pilot run 的時程下，排定設計範疇的優先順序","定義產品的設計風格","規劃並執行上線前後的測試活動，提出優化方案"],meta:[{label:"角色",value:"產品設計師"},{label:"期間",value:"2023.05 – 2025.12"},{label:"平台",value:"Android / iOS"},{label:"團隊 (10+)",value:"PO / PM 2\n產品設計 1\nUI / 插畫設計 2\n開發及數據 9"}],metrics:[{value:"8.5 成",label:"產品滿意度"},{value:"94%",label:"願意續用"},{value:"8.3%",label:"個人化推播 CTR"}],metricsNote:"數據來源：7,616 份有效問卷 (2025/01)",cover:{kind:"shapes",palette:2,seed:31},coverImg:"img/antifraud/cover-phone.webp",heroImg:"img/antifraud/cover-phone.webp",heroRatio:"4 / 3",sections:[{heading:"專案背景",steps:[{title:"Lean UX 工作流程",desc:"以迭代開發，每輪走完 Think → Make → Check，邊做邊修正。",visual:"flow"},{title:"項目時程",desc:"每 4 週一個版本，開列下一版需求的同時收集上一版回饋。",visual:"cycles"},{title:"最小可行產品 (MVP)",desc:"拆出 6 大必要功能，並預留 APP 功能擴充架構與 UI 設計。",visual:"core"},{title:"4 階段用戶測試",desc:"從專案團隊逐步擴大到網外用戶，上線後持續觀測數據。",visual:"stages"}]},{heading:"面臨挑戰",points:["反詐產品與使用者的連結低：「詐騙」讓人感到焦慮、緊張、複雜和不信任，且市面上資安與防毒產品又多走冷硬的高科技風格，大眾很難主動靠近。","產品的授權與設定門檻高：服務要先取得多項系統權限、完成相關設定才能啟用，初次使用的步驟多、理由又不清楚，使用者容易在完成前就放棄。","被動型產品如何提升留存：防護在背景默默運作，沒出事時使用者感受不到效果，缺少打開 App 互動的理由，久了就被遺忘。"]},{heading:"我怎麼做",pointImages:{0:[{src:"img/antifraud/onboarding.webp",video:"img/antifraud/onboarding.mp4",caption:"新手教學導覽",phone:!0},{src:"img/antifraud/consent.webp",caption:"機敏彈窗",phone:!0},{src:"img/antifraud/feature-vpn.webp",caption:"功能解說",phone:!0}],1:[{src:"img/antifraud/coach-1.webp",caption:"操作引導：防護紀錄",phone:!0},{src:"img/antifraud/coach-2.webp",caption:"操作引導：查號碼",phone:!0},{src:"img/antifraud/coach-3.webp",caption:"操作引導：回報與封鎖",phone:!0},{src:"img/antifraud/tutorial-1.webp",caption:"操作教學：如何回報",phone:!0},{src:"img/antifraud/tutorial-2.webp",caption:"操作教學：如何封鎖",phone:!0},{src:"img/antifraud/enable-flow.webp",caption:"功能啟用引導 & 獎勵機制"}],2:[{src:"img/antifraud/value-home.webp",caption:"首頁",phone:!0},{src:"img/antifraud/value-records.webp",caption:"防護紀錄",phone:!0},{src:"img/antifraud/value-academy.webp",caption:"反詐小學堂",phone:!0},{src:"img/antifraud/value-block.webp",caption:"來電攔阻",phone:!0}]},points:["提升連結的設計手法：透過插畫 X 舒適的綠色系為整體設計主軸，特別規劃在新手導覽動畫、機敏性對話彈窗以及功能解說，吸引用戶注意、加深閱讀意願、營造產品輕鬆的風格。文案 tone 調全面採正向的、白話的語句，提升對產品使用的理解及安心感。","「易用易懂」做進流程：首次使用主要功能教學及操作說明；未完成設定的情境下規劃鼓勵及成就升級機制，降低使用者的挫敗感並達成功能啟用的目的。","讓防護價值被看見：為讓用戶體驗到產品的價值，首頁數據化呈現防護數據，可查詢的防護紀錄、反詐小學堂提供詐騙新知、阻攔畫面帶有服務 logo，並將來電辨識的資料庫比對從地端改為雲端提高辨識率。"]},{heading:"成果",quotes:[{text:"這個 APP 是超前這個時代，\n真的是簡單、好用，而且用了讓人舒服",by:"台灣大哥大總經理 林之晨"},{text:"台灣市佔前 5 大手機品牌商中，\n為支持反詐戰警同意進行手機 APP 預載",by:"台灣大哥大商務長 林東閔"}],points:["產品滿意度 8.5 成：來自 7,616 份有效問卷 (2025/01) 的整體評價。","94% 願意續用：同一份問卷中，現有用戶的續用意願。","個人化推播 CTR 8.3%：個人化防護數據推播首發成效，是一般推播 (約 1.3%) 的 6 倍以上。","迭代優化：來電辨識改為同步雲端資料庫查詢，辨識率提升至近 8 成；Android 同意權限移至 OTP 驗證後，用戶在完成帳號建立後再交付權限，流失率降低 12%。"]}]},{slug:"myvideo",title:"MyVideo 產品策略",tag:"用戶研究",summary:"以提高 MyVideo「付費轉換率」與「使用者體驗」為目標，透過 16 位用戶的深度訪談與實機測試，找出四大目標客群「戲劇／電影／動漫／兒童」的消費動機，作為 2026 年產品優化方向。",myRole:["與 BU 單位協作確認研究目的及執行方法建議","統籌研究專案的執行進度，從受訪者篩選、招募、深度訪談及結案報告產出","提出對產品有價值的策略建議及輔助決策","追蹤研究後的方案落地成效"],meta:[{label:"角色",value:"使用者體驗研究員"},{label:"期間",value:"2025.09 – 2025.12"},{label:"平台",value:"MyVideo 全平台"},{label:"團隊",value:"MyVideo 產品與行銷部 6・用戶體驗部 3"}],metricsTitle:"研究貢獻",metrics:[{value:"2 項",label:"推進 2026 產品策略落地"},{value:"+36 分鐘",label:"兒童、動漫類影片帶動每週平均觀看時數增加"},{value:"4.2%",label:"短影音與動態素材帶動行銷 CTR"}],cover:{kind:"dots",palette:1,seed:41},coverImg:"img/myvideo/cover.webp",heroImg:"img/myvideo/cover.webp",heroRatio:"4 / 3",sections:[{heading:"關鍵洞察",groups:[{title:"市場趨勢",points:["25% 受訪者已取消觀看第四台，而多平台訂閱族群 (3 個以上) 已將 OTT 服務視為**取代傳統第四台**的方案。","選擇平台的動機強烈受到「**內容量**」、「**更新速度**」、「**是否有熱門節目**」影響，平台忠誠度較薄弱。"]},{title:"內容價值",points:["僅單訂閱 MyVideo 的 4 位受訪者，皆認同**兒童頻道**提供優質且多元的影片，且兒童模式可確保孩童觀看合宜的內容。此外，兒童頻道有機會延伸至**青少年喜愛的動漫類型**。","大部分人對**台劇的吸引力較低**，僅 1 位受訪者表示會因為原創／獨家台劇而訂閱。"]},{title:"觸及與轉換",points:["接收 OTT 影片資訊的來源主要來自 YouTube、Reels 短影音，但實際進行觀看仍以「**社群與朋友推薦**」最快切入。","近 5 成 MyVideo 的使用者，一開始是透過 momo、凱擘、Open Possible 聯名卡開始體驗，善用**集團的推廣及合作**，有機會帶動服務成長。","近 4 成用戶反應 MyVideo 首頁片單沒法引起興趣，研判是**推薦演算法精準度**不足；單瀏覽簡介較難提升興趣，評分較低則會跳過。"]}]},{heading:"研究設計",points:["研究目的：找出消費者對品牌的觀點，特別是四大目標客群的消費動機，作為 2026 年產品優化目標。","樣本設計：透過篩選問卷招募 16 位受訪者，交叉「已訂閱／未訂閱 (有 OTT 經驗)」與「戲劇／電影／動漫／兒童」四大內容偏好。","兩階段流程：用戶訪談 45 分鐘，接著在 mWeb / App 上進行 20 分鐘實機測試。"],diagram:"mv-research"},{heading:"OTT 生命週期",body:"把 16 位用戶的訪談收斂成四個階段，對應每個階段的行為、接觸點與用戶心態，找出行銷與產品該介入的時機。",diagram:"mv-lifecycle"},{heading:"客群分析",body:"依「OTT 訂閱數量 × 觀看類型」把 16 位用戶分成三種客群，再從中建立 3 個 Persona。",diagram:"mv-quadrant",cards:[{img:"img/mv/persona-kevin.webp",title:"Kevin｜45–50 歲｜已婚男性",tag:"高訂閱，核心家庭",body:"一家四口各自觀影，訂閱五個平台的高級年方案，視 OTT 為取代第四台的解決方案；不習慣「月租後還需單次付費」。"},{img:"img/mv/persona-wen.webp",title:"Wen｜36 歲｜未婚女性",tag:"高訂閱，原生家庭",body:"典型「內容獵人」，與家人朋友共享帳號並主導訂閱決策，重視操作便利性，視其為提升家庭觀影體驗的關鍵。"},{img:"img/mv/persona-pei.webp",title:"Pei｜30–35 歲｜已婚女性",tag:"單一訂閱、內容聚焦族",body:"MyVideo 是唯一付費平台，透過兒童卡通與孩子建立共同話題；強烈排斥訂閱後仍需單次付費，但願意接受合理漲價。"}]},{heading:"兒童內容的留存價值",body:"四大內容中，兒童內容評價最正向：內容具吸引力，且沒有主要競爭品牌。有看兒童內容的用戶，留存率在 Paid-TWM 與 Paid-D2C 中都最高，且明顯高於未觀看的用戶。",diagram:"mv-retention"},{heading:"實機測試",body:"以 mWeb / App 為主 (行銷推廣以手機為主)，16 位用戶從 FB 粉專貼文點擊影片 > 進入影片介紹頁 > 付費觀看的任務完成率為 93%，發現卡關的地方如下：",points:["登入／註冊：密碼規則過嚴、第三方登入不足、註冊後沒有自動登入。","付費流程：不清楚「訂閱豪華」與「租借」差異、觀看範圍、劇集租借規則不清楚；已訂閱還要單次付費造成心態落差。"]},{heading:"結論與建議",cards:[{title:"產品定位",body:"發現：高訂閱族群同時訂閱多個平台（如 Kevin 訂閱五個），MyVideo 較難成為唯一選擇。\n建議：定位為多平台訂閱者的「第二開啟平台」，以影音包與其他 OTT 組合，降低重複訂閱的負擔。"},{title:"內容定位",body:"發現：25% 受訪者已取消觀看第四台，多平台訂閱族群 (3 個以上) 把 OTT 視為取代第四台的方案；兒童內容評價最正向且留存最高。\n建議：善用集團資源 (凱擘、momo) 補齊新聞、運動賽事等即時頻道，承接從第四台轉向 OTT 的用戶，並以親子與 BBC 內容鞏固家庭客群。"},{title:"行銷定位",body:"發現：約 80% 從社群短影片、預告取得影片資訊，只看簡介難以提起興趣。\n建議：以短影音與動態素材取代長篇預告與文字簡介，並透過親子社群觸及家長。"},{title:"產品優化",body:"登入註冊：調整密碼規則或導入 OTP 登入，增加第三方登入管道。\n訂閱方案：租借與方案權益資訊更完整，續扣與退訂機制透明。\n影片瀏覽：強化推薦引擎與個人化片單，加入兒童觀看時間提醒與 7–15 歲青少年內容分級。"}]},{heading:"建議落地實證",body:"上述三項定位建議，已在 MyVideo 後續的產品與行銷調整中得到驗證：",diagram:"mv-proof"}]},{slug:"lazy-kingdom",title:"懶惰王國：美夢保衛戰",tag:"AI 遊戲設計",summary:"台灣大哥大「第三屆數據及生成式 AI 大賽」Vibe Coding 組參賽作品。以 8/10「國際懶惰日」為題，做出畫 Z、O、U 符號施放魔法、擊退噪音怪的像素風網頁遊戲，從世界觀到程式全程以 AI 協作完成，拿下第三名。",myRole:["擔任隊長，從「國際懶惰日」發想命題與世界觀，定義角色與故事","設計核心玩法與補死機制：筆畫魔法、生命值、難度曲線與雙結局","整合跨處室團隊的分工與進度，決賽簡報發表","建立圖像、文件與 Vibe Coding 的 Prompt 工作流，帶團隊一起體驗 AI 工具"],meta:[{label:"角色",value:"隊長・企劃與設計"},{label:"期間",value:"2025.07.05 – 2025.09.15 (決賽公布)"},{label:"平台",value:"網頁遊戲"},{label:"團隊",value:"數位媒體處：我、Ann、Jen、怡萱\n產品技術處：Candy"}],metrics:[{value:"第三名",label:"2025 TWM DATA GAMES・Vibe Coding 組"},{value:"8 週",label:"從命題發想到完成可玩的遊戲"},{value:"0 元",label:"全程以免費試用版 AI 工具打造"}],cover:{kind:"shapes",palette:3,seed:71},coverImg:"img/lazy/cover.webp",heroImg:"img/lazy/hero.webp",heroImg2:"img/lazy/ending.webp",sections:[{heading:"角色介紹",cards:[{img:"img/lazy/king.webp",imgTop:!0,title:"鴨子國王『呱呱一世』",tag:"守護對象",body:"懶惰王國的統治者，最大的願望是在國際懶惰日好好睡一覺：全國不准工作、不准開會。"},{img:"img/lazy/mage.webp",imgTop:!0,title:"魔法師『梅夢』",tag:"玩家角色",body:"沉睡王國裡唯一清醒的守護者，擅長『畫符號』魔法，在床邊擋下噪音。"},{img:"img/lazy/monsters.webp",imgTop:!0,title:"噪音軍團 Z・O・U",tag:"敵人",body:"Zak 震震音波、Orrbr 鼾聲砲彈、Umbra 簌簌風刃，妄想破壞懶惰日。"}]},{heading:"核心玩法",points:["看到怪物頭上的 Z、O、U 符號，用滑鼠或手指畫出對應筆畫即可擊退。","共 5 條生命值，怪物碰到好眠結界扣 1 條。","撐過 2 分鐘是「精神飽滿」好結局，提早失敗則是「睡眠不足」。"],figures:[{src:"img/lazy/draw.webp",caption:"畫出 O 的瞬間：筆跡即時顯示，辨識成功就發動魔法。"}]},{heading:"Vibe Coding 做法",body:"團隊 0 遊戲開發經驗，把流程拆成四段、各挑適合的工具，8 週做出可玩的遊戲。",groups:[{title:"一、建立故事與遊戲架構 (ChatGPT)",points:["以「得獎插畫家構思新作」的 Role Prompt 產出故事腳本","角色設定與技能整理成 md 文件，沿用到後續","輸出 12 幕、每幕 5 秒的前導影片分鏡"]},{title:"二、美術素材 (ChatGPT・Midjourney)",points:["先定調主場景，再把場景圖回饋給模型分析，萃取成同一套 Style Prompt 延伸","以 Python 腳本把每個色塊轉成 10px 方塊，統一像素顆粒"]},{title:"三、玩法與程式 (Claude Sonnet 4・Cursor・Replit)",points:["以 md 文件當專案 context，從開源的一筆畫辨識演算法生成初版場景","Cursor 建立索引理解專案架構，Replit 負責協作與部署","計分、難度曲線、RWD 相對位置等規則都以多輪對話迭代"]},{title:"四、調校與除錯",points:["容錯率太低、O 逆時針畫不過 → 調整辨識的彎曲度與方向判定","RWD 下怪物與結界的碰撞位置偏移 → 改用相同單位重算相對位置","移除重複與未使用的程式碼，修正影片預載與 loading"]}]},{heading:"技術亮點",cards:[{title:"筆畫辨識",body:"發現：單純比對軌跡相似度，玩家畫得稍微歪就判定失敗。\n做法：改用多重維度檢測，以彎曲度、深度與筆畫方向判定。"},{title:"遊戲難易度",body:"發現：固定節奏的遊戲在 30 秒後就失去張力。\n做法：縮短生成間隔、提高怪物上限，並加入攻擊失敗的懲罰加速。"},{title:"遊戲體驗",body:"發現：玩家需要立即知道自己有沒有打中。\n做法：圖像式生命值、Good／Missed 回饋與怪物變色動態，手機直立時顯示轉向提示。"}]},{heading:"決賽獲獎",body:"2025 第三屆 TWM DATA GAMES・Vibe Coding 組第三名。",figures:[{src:"img/lazy/award.webp",caption:"決賽暨頒獎典禮，五位隊員與獎座合影。"}]},{heading:"實際玩玩看",body:"建議使用桌機搭配滑鼠，手機或平板請橫向操作。",d
